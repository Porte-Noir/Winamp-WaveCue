name: Build Winamp WaveCue 32-bit
on:
  workflow_dispatch:
  push:
    branches: [main, 'experimental/**']
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dr_flac decoder
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/mackron/dr_libs/4ffbded724cc3e3d2838eebca70858bf5984385a/dr_flac.h"
          Invoke-WebRequest -Uri $url -OutFile src/dr_flac.h
          if ((Get-Item src/dr_flac.h).Length -lt 100000) { throw "Incomplete FLAC decoder download" }
      - name: Fetch pinned stb_vorbis decoder for OGG Vorbis
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/nothings/stb/1ee679ca2ef753a528db5ba6801e1067b40481b8/stb_vorbis.c"
          Invoke-WebRequest -Uri $url -OutFile src/stb_vorbis.c
          if ((Get-Item src/stb_vorbis.c).Length -lt 100000) { throw "Incomplete OGG Vorbis decoder download" }
      - name: Fetch pinned libKeyFinder (GPLv3+)
        shell: pwsh
        run: |
          git clone --quiet https://github.com/mixxxdj/libkeyfinder.git third_party/libkeyfinder
          git -C third_party/libkeyfinder checkout --quiet 941e517ebf853c2153a8b9d6efcc0c729199aa0b
      - name: Install static FFTW3 for Win32
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install fftw3:x86-windows-static
          if ($LASTEXITCODE -ne 0) { throw "Static FFTW3 installation failed" }
      - name: Fetch pinned BTrack (GPLv3)
        shell: pwsh
        run: |
          git clone --quiet https://github.com/adamstark/BTrack.git third_party/BTrack
          git -C third_party/BTrack checkout --quiet 9d6127618a5679e9caa74c594b88f1d74f0e035f
      - name: Adapt BTrack variable-length arrays for MSVC Win32
        shell: pwsh
        run: |
          $path = "third_party/BTrack/src/BTrack.cpp"
          $source = Get-Content -Raw $path
          $patches = @(
            @('float input[onsetDFBufferSize];', 'std::vector<float> input(onsetDFBufferSize);'),
            @('double threshold[N];', 'std::vector<double> threshold(N);'),
            @('double logGaussianTransitionWeighting[windowSize];', 'std::vector<double> logGaussianTransitionWeighting(windowSize);'),
            @('double futureCumulativeScore[onsetDFBufferSize + beatExpectationWindowSize];', 'std::vector<double> futureCumulativeScore(onsetDFBufferSize + beatExpectationWindowSize);'),
            @('double beatExpectationWindow[beatExpectationWindowSize];', 'std::vector<double> beatExpectationWindow(beatExpectationWindowSize);'),
            @('double logGaussianTransitionWeighting[pastWindowSize];', 'std::vector<double> logGaussianTransitionWeighting(pastWindowSize);'),
            @('SRC_DATA src_data;', 'SRC_DATA src_data{};'),
            @('src_data.data_in = input;', 'src_data.data_in = input.data();'),
            @('createLogGaussianTransitionWeighting (logGaussianTransitionWeighting,', 'createLogGaussianTransitionWeighting (logGaussianTransitionWeighting.data(),'),
            @('calculateNewCumulativeScoreValue (cumulativeScore, logGaussianTransitionWeighting,', 'calculateNewCumulativeScoreValue (cumulativeScore, logGaussianTransitionWeighting.data(),'),
            @('calculateNewCumulativeScoreValue (futureCumulativeScore, logGaussianTransitionWeighting,', 'calculateNewCumulativeScoreValue (futureCumulativeScore.data(), logGaussianTransitionWeighting.data(),')
          )
          foreach ($p in $patches) {
            if (-not $source.Contains($p[0])) { throw "BTrack upstream changed: $($p[0])" }
            $source = $source.Replace($p[0], $p[1])
          }
          Set-Content -Path $path -Value $source -Encoding utf8
      - name: Install static libsamplerate for Win32
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libsamplerate:x86-windows-static
          if ($LASTEXITCODE -ne 0) { throw "Static libsamplerate installation failed" }
      - name: Configure Win32
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DFFTW3_INCLUDE_DIR="$env:VCPKG_INSTALLATION_ROOT/installed/x86-windows-static/include" -DFFTW3_LIBRARY="$env:VCPKG_INSTALLATION_ROOT/installed/x86-windows-static/lib/fftw3.lib" -DLIBSAMPLERATE_INCLUDE_DIR="$env:VCPKG_INSTALLATION_ROOT/installed/x86-windows-static/include" -DLIBSAMPLERATE_LIBRARY="$env:VCPKG_INSTALLATION_ROOT/installed/x86-windows-static/lib/samplerate.lib"
      - name: Build Release
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'main' && 'gen_wavecue-win32' || github.ref_name == 'experimental/btrack-abi-fix' && 'gen_wavecue-btrack-abi-fix' || github.ref_name == 'experimental/btrack-constructor-probe' && 'gen_wavecue-btrack-constructor-probe' || github.ref_name == 'experimental/btrack-diagnostic-no-analysis' && 'gen_wavecue-btrack-diagnostic-no-analysis' || github.ref_name == 'experimental/btrack-bpm-safety' && 'gen_wavecue-btrack-bpm-safety' || github.ref_name == 'experimental/btrack-bpm' && 'gen_wavecue-btrack-bpm' || github.ref_name == 'experimental/rms-boost-auto-cache' && 'gen_wavecue-rms-boost-auto-cache' || github.ref_name == 'experimental/rms-auto-height' && 'gen_wavecue-rms-auto-height' || github.ref_name == 'experimental/cyan-rms-black' && 'gen_wavecue-cyan-rms-black' || github.ref_name == 'experimental/winamp-forest-green' && 'gen_wavecue-winamp-forest-green' || github.ref_name == 'experimental/winamp-soft-lcd' && 'gen_wavecue-winamp-soft-lcd' || github.ref_name == 'experimental/winamp-lime-grid' && 'gen_wavecue-winamp-lime-grid' || github.ref_name == 'experimental/winamp-lcd-waveforms' && 'gen_wavecue-winamp-lcd-waveforms' || github.ref_name == 'experimental/winamp-classic-ui' && 'gen_wavecue-winamp-classic-ui' || 'gen_wavecue-camelot-experimental' }}
          path: build/Release/gen_wavecue.dll
          if-no-files-found: error
